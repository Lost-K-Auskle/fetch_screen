<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Handle</title>
    <link rel="stylesheet" href="./src/styles/pinhandle.css" />
  </head>
  <body>
    <div id="h" title="双击恢复交互">⣿</div>
    <script>
      // 双击小把手 → 切回贴图交互模式（穿透时整窗点不到，靠这个把手恢复）
      window.addEventListener('dblclick', function () {
        if (window.__TAURI__) {
          window.__TAURI__.core.invoke('set_pin_passthrough', { enabled: false }).catch(console.error);
        }
      });
    </script>
  </body>
</html>
