[package]
name = "fetch-screen"
version = "0.1.0"
description = "截图工具：滚动截图 + 贴图置顶"
authors = ["fetch-screen"]
edition = "2021"

[package.metadata.tauri-winres]
FileDescription = "Fetch Screen - 截图工具"
ProductName = "Fetch Screen"
OriginalFilename = "fetch-screen.exe"

[lib]
name = "fetch_screen_lib"
crate-type = ["lib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.3"
image = "0.25"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_DataExchange",
] }
rustfft = "6"
log = "0.4"
env_logger = "0.11"
dirs = "5"
chrono = "0.4"
rand = "0.8"
arboard = "3"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 发布构建优化：薄 LTO + 优化级别，减小体积、提速启动与运行
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
